<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shared with TeDrive</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#0A1B45; color:#fff; }
  main { max-width:420px; padding:32px 24px; text-align:center; }
  img { width:88px; height:88px; border-radius:20px; }
  h1 { font-size:22px; margin:20px 0 8px; }
  p { color:#c5cee6; line-height:1.5; margin:8px 0; }
  a.btn { display:block; margin:14px 0; padding:14px; border-radius:12px; text-decoration:none;
          font-weight:600; background:#1677F0; color:#fff; }
  a.alt { background:transparent; border:1px solid #4a5a8a; }
  small a { color:#8fb6ff; }
</style>
</head>
<body>
<main>
  <img src="../icons/Icon-192.png" alt="">
  <h1>A file was shared with you</h1>
  <p id="msg">Open it in Telegram to view or download it.</p>
  <a class="btn" id="app" href="#">Open in Telegram app</a>
  <a class="btn alt" id="web" href="#" rel="noopener">Open in browser</a>
  <a class="btn alt" id="web2" href="#" rel="noopener">Browser link not opening? Try this one</a>
  <p><small>Shared with <a href="../">TeDrive</a>. No Telegram?
  <a href="https://telegram.org/apps" rel="noopener">Get it free</a>.</small></p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var c = q.get('c') || '', p = q.get('p') || '';
  if (/^[A-Za-z0-9_]{4,40}$/.test(c) && /^\d{1,12}$/.test(p)) {
    document.getElementById('app').href = 'tg://resolve?domain=' + c + '&post=' + p;
    document.getElementById('web').href = 'https://t.me/' + c + '/' + p;
    document.getElementById('web2').href = 'https://telegram.dog/' + c + '/' + p;
  } else {
    document.getElementById('msg').textContent = 'This link is not valid.';
    ['app', 'web', 'web2'].forEach(function (id) { document.getElementById(id).style.display = 'none'; });
  }
</script>
</body>
</html>
