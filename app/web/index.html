<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TeDrive: your personal cloud drive and photo library, stored in your own Telegram account.">
  <meta name="theme-color" content="#0A1B45">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TeDrive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>TeDrive</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen, shown while the app (a few MB) downloads. */
    html, body { margin: 0; height: 100%; background: #0A1B45; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0A1B45; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 24px; }
    #splash h1 { margin: 20px 0 4px; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
    #splash p { margin: 0; color: #B9C6E8; font-size: 15px; }
    #splash .bar {
      width: 160px; height: 4px; margin-top: 28px; border-radius: 2px;
      background: rgba(255,255,255,.15); overflow: hidden;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #1677F0; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
    #splash .error { display: none; max-width: 320px; margin-top: 24px; text-align: center; color: #FFB4AB; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <h1>TeDrive</h1>
    <p>Loading…</p>
    <div class="bar"></div>
    <div class="error">TeDrive could not start in this browser. Try reloading, or use a recent version of Chrome, Edge, Firefox or Safari.</div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      // Flutter fires this once the app has drawn its first screen.
      window.addEventListener('flutter-first-frame', function () {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      });
      // If nothing has appeared after 60 seconds, say so instead of spinning forever.
      setTimeout(function () {
        if (document.body.contains(splash) && !splash.classList.contains('hidden')) {
          splash.querySelector('.bar').style.display = 'none';
          splash.querySelector('.error').style.display = 'block';
        }
      }, 60000);
    })();
  </script>
  <!-- Telegram's library (TDLib in WebAssembly) and TeDrive's bridge to it. -->
  <script src="tdweb.js"></script>
  <script src="tedrive_td.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
