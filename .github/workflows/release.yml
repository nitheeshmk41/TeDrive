name: Release

# Builds the Android app and the web demo when a version tag is pushed,
# and attaches them to a GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Unit tests
        working-directory: app
        run: dart test

  build-android:
    name: Build Android APKs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "artifacts/TeDrive-${GITHUB_REF_NAME}-android-arm64.apk"
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "artifacts/TeDrive-${GITHUB_REF_NAME}-android-arm32.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*.apk

  build-web-demo:
    name: Build web demo
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build web
        working-directory: app
        run: flutter build web --release --no-tree-shake-icons
      - name: Package
        run: |
          mkdir -p artifacts
          cd app/build/web
          zip -r "../../../artifacts/TeDrive-${GITHUB_REF_NAME}-web-demo.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: artifacts/*.zip

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-web-demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: TeDrive ${{ github.ref_name }}
          files: assets/*
          body: |
            A personal cloud drive that keeps your files in a private channel of your own Telegram account.

            ### Downloads

            | File | For |
            | :--- | :--- |
            | `TeDrive-${{ github.ref_name }}-android-arm64.apk` | Most Android phones (recommended) |
            | `TeDrive-${{ github.ref_name }}-android-arm32.apk` | Older 32-bit Android phones |
            | `TeDrive-${{ github.ref_name }}-web-demo.zip` | Web demo with sample files. It does not connect to Telegram. |

            ### Installing on Android

            1. Download the APK to your phone and open it. Allow installing from this source if asked.
            2. Open TeDrive and follow the setup: it asks for a free Telegram API ID and hash from [my.telegram.org](https://my.telegram.org), then your phone number.

            These APKs are signed with a development key, so Android cannot update them from a store, and Play Protect may ask you to confirm the install.
