name: Build and release

# Every push to main builds all platforms, so problems show up early.
# Pushing a version tag (v1.0.0) also publishes the builds as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # TDLib (Telegram's client library) is built from source for desktop.
  # This is the same version (1.8.15) as the library inside the Android app,
  # so every platform talks to Telegram in exactly the same way.
  TDLIB_COMMIT: 8e1a7dbac29cea82292f33d6c11c43e13ffcf658

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the app is developed and checked with.
          flutter-version: 3.47.7
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: app
        run: dart test

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the app is developed and checked with.
          flutter-version: 3.47.7
          cache: true
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set. The APK is signed with a throwaway debug key, so later versions cannot update it in place."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
      - name: Collect
        run: |
          mkdir -p artifacts
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/TeDrive-android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/TeDrive-android-arm32.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  web:
    name: Web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the app is developed and checked with.
          flutter-version: 3.47.7
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons
          bash tool/fetch_tdweb.sh build/web
      - name: Package
        run: |
          mkdir -p artifacts
          cd app/build/web
          zip -qr ../../../artifacts/TeDrive-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: artifacts/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: test
    # The oldest supported Ubuntu, so the build also runs on newer systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang cmake pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev \
            gperf libssl-dev zlib1g-dev
      - name: Restore TDLib
        id: tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdlib-linux-x64-${{ env.TDLIB_COMMIT }}-v1
      - name: Build TDLib
        if: steps.tdlib.outputs.cache-hit != 'true'
        run: |
          git init -q td && cd td
          git remote add origin https://github.com/tdlib/td.git
          git fetch -q --depth 1 origin "$TDLIB_COMMIT"
          git checkout -q FETCH_HEAD
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          cmake --build . --target tdjson -j "$(nproc)"
          mkdir -p ../../tdlib-out
          cp -L libtdjson.so ../../tdlib-out/libtdjson.so
          strip --strip-unneeded ../../tdlib-out/libtdjson.so
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the app is developed and checked with.
          flutter-version: 3.47.7
          cache: true
      - name: Build app
        working-directory: app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
      - name: Package
        run: |
          bundle=app/build/linux/x64/release/bundle
          cp tdlib-out/libtdjson.so "$bundle/lib/libtdjson.so"
          mkdir -p artifacts stage
          cp -r "$bundle" stage/TeDrive
          tar -C stage -czf artifacts/TeDrive-linux-x64.tar.gz TeDrive
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: test
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore TDLib
        id: tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdlib-windows-x64-${{ env.TDLIB_COMMIT }}-v3
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-v1
      - name: Build TDLib
        if: steps.tdlib.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows\bin")) {
            vcpkg install gperf:x64-windows openssl:x64-windows zlib:x64-windows *> vcpkg.log
            if ($LASTEXITCODE -ne 0) {
              $tail = (Get-Content vcpkg.log -Tail 15) -join '%0A'
              Write-Output "::error title=vcpkg failed::$tail"
              throw 'vcpkg failed'
            }
          }
          git init -q td
          Set-Location td
          git remote add origin https://github.com/tdlib/td.git
          git fetch -q --depth 1 origin $env:TDLIB_COMMIT
          git checkout -q FETCH_HEAD
          New-Item -ItemType Directory build | Out-Null
          Set-Location build
          cmake -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5.0" .. *> configure.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content configure.log -Tail 25 | Write-Host
            $tail = (Get-Content configure.log -Tail 12) -join '%0A'
            Write-Output "::error title=TDLib configure failed::$tail"
            throw 'cmake configure failed'
          }
          cmake --build . --target tdjson --config Release -- /m:1 /p:CL_MPCount=2 /v:minimal *> build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 30 | Write-Host
            $tail = (Get-Content build.log -Tail 25 | Where-Object { $_ -match 'error|fatal|warning C|failed' } | Select-Object -Last 12) -join '%0A'
            if (-not $tail) { $tail = (Get-Content build.log -Tail 12) -join '%0A' }
            Write-Output "::error title=TDLib build failed::$tail"
            throw 'TDLib build failed'
          }
          New-Item -ItemType Directory -Force ..\..\tdlib-out | Out-Null
          # tdjson.dll plus the OpenSSL and zlib DLLs it needs.
          Copy-Item Release\*.dll ..\..\tdlib-out\ -ErrorAction SilentlyContinue
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" ..\..\tdlib-out\ -Force
          }
          Get-ChildItem ..\..\tdlib-out
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the app is developed and checked with.
          flutter-version: 3.47.7
          cache: true
      - name: Build app
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'app\build\windows\x64\runner\Release'
          Copy-Item tdlib-out\*.dll $release -Force
          if (-not (Test-Path "$release\tdjson.dll")) { throw 'tdjson.dll is missing' }
          if (-not (Test-Path "$release\TeDrive.exe")) { throw 'TeDrive.exe is missing' }
          New-Item -ItemType Directory -Force artifacts, stage | Out-Null
          Copy-Item $release stage\TeDrive -Recurse
          Compress-Archive -Path stage\TeDrive -DestinationPath artifacts\TeDrive-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: test
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore TDLib
        id: tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdlib-macos-arm64-${{ env.TDLIB_COMMIT }}-v2
      - name: Build TDLib
        if: steps.tdlib.outputs.cache-hit != 'true'
        run: |
          brew install gperf || true
          brew install openssl@3 || true
          git init -q td && cd td
          git remote add origin https://github.com/tdlib/td.git
          git fetch -q --depth 1 origin "$TDLIB_COMMIT"
          git checkout -q FETCH_HEAD
          mkdir build && cd build
          OPENSSL_PREFIX="$(brew --prefix openssl@3 2>/dev/null || echo '/opt/homebrew/opt/openssl@3')"
          if ! cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE .. > configure.log 2>&1; then
            cat configure.log | tail -30
            echo "::error title=TDLib configure failed::$(tail -12 configure.log | tr '\n' '|')"
            exit 1
          fi
          if ! cmake --build . --target tdjson -j "$(sysctl -n hw.ncpu)" > build.log 2>&1; then
            cat build.log | tail -30
            echo "::error title=TDLib build failed::$(grep -E 'error|fatal' build.log | tail -12 | tr '\n' '|')"
            exit 1
          fi
          mkdir -p ../../tdlib-out
          cp -L libtdjson.dylib ../../tdlib-out/libtdjson.dylib
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the app is developed and checked with.
          flutter-version: 3.47.7
          cache: true
      - name: Build app
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
      - name: Package
        run: |
          app=$(ls -d app/build/macos/Build/Products/Release/*.app | head -1)
          echo "App bundle: $app"
          mkdir -p "$app/Contents/Frameworks"
          cp tdlib-out/libtdjson.dylib "$app/Contents/Frameworks/libtdjson.dylib"
          install_name_tool -id @rpath/libtdjson.dylib "$app/Contents/Frameworks/libtdjson.dylib"
          # Not notarised: an ad-hoc signature is the most an unpaid build can have.
          codesign --force --deep --sign - "$app"
          mkdir -p artifacts
          ditto -c -k --keepParent "$app" artifacts/TeDrive-macos-arm64.zip
          # A disk image with the app and a shortcut to Applications.
          mkdir -p dmg
          cp -R "$app" dmg/TeDrive.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname TeDrive -srcfolder dmg -ov -format UDZO artifacts/TeDrive-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # Android is required. Each desktop build is included if it succeeded.
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.android.result == 'success' }}
    needs: [android, web, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Add the version to the file names
        run: |
          cd assets
          for f in TeDrive-*; do
            mv "$f" "${f/TeDrive-/TeDrive-${GITHUB_REF_NAME}-}"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: TeDrive ${{ github.ref_name }}
          files: assets/*
          body: |
            A personal cloud drive that keeps your files in a private channel of your own Telegram account. No TeDrive server, no subscription.

            ### Downloads

            | File | For |
            | :--- | :--- |
            | `android-arm64.apk` | Most Android phones (recommended). If a phone browser stops at 100%, use https://tedrive.vercel.app/download/TeDrive-android-arm64.apk |
            | `android-arm32.apk` | Older 32-bit Android phones |
            | `windows-x64.zip` | Windows 10 and 11. Unzip and run `TeDrive.exe`. |
            | `linux-x64.tar.gz` | Linux (Ubuntu 22.04 or newer and similar). Unpack and run `TeDrive/tedrive`. |
            | `macos-arm64.dmg` | Macs with Apple Silicon. Open it and drag TeDrive to Applications. Not notarised: right-click the app and choose Open the first time. |
            | `macos-arm64.zip` | The same Mac app as a zip. |
            | `web.zip` | The web app, to host yourself. It also runs at https://tedrive.vercel.app |

            A file missing from this list did not build for this release.

            ### Before you install

            - **Android is the tested platform.** The Windows, Linux and macOS apps are first builds: they use the same code and the same Telegram library, but have had little real-world testing. Phone backup, the system file picker and the built-in video player are Android features.
            - **Setup** needs a free Telegram API ID and hash from [my.telegram.org](https://my.telegram.org), then your phone number. Sign in with the same number on every device to see the same files.
            - **Linux** needs GTK 3, OpenSSL 3 and a keyring service (GNOME Keyring or KWallet).
            - **Keep a second copy of anything irreplaceable.** Telegram is not a contracted storage service.
      - name: Refresh the web app's direct APK downloads
        # tedrive.vercel.app/download/ copies the APKs of the latest release
        # when it builds. A Vercel deploy hook (secret VERCEL_DEPLOY_HOOK)
        # rebuilds it now; without one it updates on the next push to main.
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::No VERCEL_DEPLOY_HOOK secret: tedrive.vercel.app/download updates on the next push to main."
          else
            curl -fsS -X POST "$HOOK"
          fi
      - name: Post the Android app to a Telegram channel
        # Optional. Some phone browsers (Brave) never finish APK downloads;
        # installing from a Telegram channel avoids the browser entirely.
        # Needs secrets TELEGRAM_BOT_TOKEN (from @BotFather) and
        # TELEGRAM_CHAT_ID (the channel, with the bot added as an admin).
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "::notice::No TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID: APK not posted to Telegram."
            exit 0
          fi
          apk=$(ls assets/*android-arm64.apk | head -1)
          curl -fsS -F chat_id="$CHAT" -F document=@"$apk" \
            -F caption="TeDrive ${GITHUB_REF_NAME} for Android. Tap to download, then open it to install." \
            "https://api.telegram.org/bot${BOT}/sendDocument" > /dev/null
